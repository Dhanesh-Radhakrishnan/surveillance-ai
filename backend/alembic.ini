# alembic.ini
# Alembic configuration for the surveillance backend.
#
# DATABASE_URL must be set in your environment (or .env loaded by the app):
#   postgresql+asyncpg://surveillance:changeme@localhost:5432/surveillance_db
#
# The %40 encodes the '@' in the password — required in URL-form DSNs.
# asyncpg is mandatory here: sync drivers will deadlock inside async SQLAlchemy.
#
# Run migrations from the /backend directory:
#   alembic upgrade head          — apply all pending migrations
#   alembic downgrade -1          — roll back one step
#   alembic revision --autogenerate -m "describe change"  — generate new migration

[alembic]
script_location = alembic

# sqlalchemy.url is intentionally left blank.
# env.py reads DATABASE_URL from the environment at runtime so credentials
# are never hardcoded in version-controlled config files.
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
